<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<title>Операция Решет · מבצע רשת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap">
<style>
:root{--bg:#1b1f24;--panel:#242a31;--line:#444e59;--ink:#e4e7e3;--mute:#97a1a8;--amber:#e9b04a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:28px;line-height:1.2}
p{margin:0;color:var(--mute);line-height:1.5}
a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
a:hover,a:focus-visible{border-color:var(--amber);outline:none}
a b{font-size:20px}
a span{color:var(--mute);font-size:14px}
.he{direction:rtl;text-align:right}
</style>
</head>
<body>
<main>
  <h1>Операция «Решет»<br><span class="he" style="display:block">מבצע «רשת»</span></h1>
  <p>Ночная операция спецназа. Вы командир у рации и видите только то, что вам докладывают.</p>
  <a href="ru/"><b>Играть на русском</b><span>Позывной «Кобра-6»</span></a>
  <a href="he/" class="he" lang="he"><b>לשחק בעברית</b><span>אות קריאה «צפע»</span></a>
</main>
</body>
</html>
